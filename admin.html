<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖哀悼馆 - 管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
            color: #e0e0e0;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        /* 登录框 */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 3px;
        }
        .login-box input:focus { outline: none; border-color: #667eea; }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-box button:hover { transform: translateY(-2px); }

        /* 统计卡片 */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .stat-card .number { font-size: 2.5rem; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #888; margin-top: 8px; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar-left, .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar button {
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 8px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .toolbar button:hover { background: rgba(102, 126, 234, 0.3); }
        .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .toolbar .btn-danger {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.4);
            color: #e74c3c;
        }
        .toolbar .btn-danger:hover { background: rgba(231, 76, 60, 0.3); }
        .toolbar input {
            padding: 10px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #e0e0e0;
            width: 250px;
            font-family: inherit;
        }
        .toolbar input:focus { outline: none; border-color: #667eea; }
        .select-count { color: #888; font-size: 0.9rem; }

        /* 表格 */
        .table-wrapper {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th {
            background: rgba(255,255,255,0.05);
            color: #667eea;
            font-weight: bold;
            position: sticky;
            top: 0;
            user-select: none;
        }
        tr:hover { background: rgba(255,255,255,0.03); }
        tr.selected { background: rgba(102, 126, 234, 0.08); }
        td { color: #ccc; font-size: 0.95rem; vertical-align: top; }
        .col-time { white-space: nowrap; color: #888; font-size: 0.85rem; }
        .col-story { max-width: 300px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .empty { text-align: center; padding: 60px; color: #666; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 4px;
            font-size: 0.8rem;
            color: #667eea;
        }

        /* 复选框 */
        .row-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }
        th .row-checkbox { cursor: pointer; }

        /* 确认对话框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-box h3 { margin-bottom: 15px; color: #e74c3c; }
        .modal-box p { color: #aaa; margin-bottom: 25px; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .modal-actions .btn-cancel {
            background: rgba(255,255,255,0.08);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .modal-actions .btn-cancel:hover { background: rgba(255,255,255,0.12); }
        .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .modal-actions .btn-confirm:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 登录界面 -->
        <div id="login-page" class="login-box">
            <h2>🔐 管理后台</h2>
            <p style="color:#888; margin:15px 0;">请输入访问密码</p>
            <input type="password" id="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
            <button onclick="login()">进入后台</button>
            <p id="login-error" style="color:#e74c3c; margin-top:15px; display:none;">密码错误</p>
        </div>

        <!-- 数据面板 -->
        <div id="dashboard" style="display:none;">
            <h1>外卖哀悼馆 - 管理后台</h1>
            <p class="subtitle">查看所有外卖被偷案件的详细数据</p>

            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="stat-total">0</div>
                    <div class="label">总案件数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-today">0</div>
                    <div class="label">今日新增</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-week">0</div>
                    <div class="label">本周新增</div>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <button onclick="loadData()">🔄 刷新数据</button>
                    <button onclick="exportCSV()">📥 导出CSV</button>
                    <button class="btn-danger" id="btn-batch-delete" onclick="showDeleteModal()" disabled>
                        🗑️ 批量删除
                    </button>
                    <span class="select-count" id="select-count"></span>
                </div>
                <div class="toolbar-right">
                    <input type="text" id="search" placeholder="搜索地点、外卖、姓名..." oninput="filterData()">
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" class="row-checkbox" id="check-all" onchange="toggleSelectAll()"></th>
                            <th>#ID</th>
                            <th>姓名</th>
                            <th>联系方式</th>
                            <th>事发地点</th>
                            <th>被偷时间</th>
                            <th>外卖内容</th>
                            <th>金额</th>
                            <th>详细描述</th>
                            <th>提交时间</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="10" class="empty">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <h3>⚠️ 确认删除</h3>
            <p id="delete-modal-text">确定要删除选中的记录吗？此操作不可恢复。</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="hideDeleteModal()">取消</button>
                <button class="btn-confirm" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/submit';
        let allData = [];
        let selectedIds = new Set();

        async function login() {
            const pwd = document.getElementById('password').value;
            const error = document.getElementById('login-error');
            error.style.display = 'none';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', password: pwd })
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.message || '登录失败');
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadData();
            } catch (e) {
                error.textContent = e.message || '登录失败';
                error.style.display = 'block';
            }
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="10" class="empty">加载中...</td></tr>';
            selectedIds.clear();
            updateSelectUI();

            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                if (data.success && data.admin) {
                    allData = data.recent || [];
                    renderTable(allData);
                    updateStats(allData);
                } else {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty">数据加载失败，请检查密码是否正确</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty">网络错误，请稍后重试</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, index) => {
                const date = new Date(item.createdAt);
                const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                const isChecked = selectedIds.has(item._id) ? 'checked' : '';
                return `
                    <tr class="${isChecked ? 'selected' : ''}" data-id="${item._id}">
                        <td><input type="checkbox" class="row-checkbox" ${isChecked} onchange="toggleRow('${item._id}')" onclick="event.stopPropagation()"></td>
                        <td><span class="badge">#${data.length - index}</span></td>
                        <td>${escapeHtml(item.name || '-')}</td>
                        <td>${escapeHtml(item.contact || '-')}</td>
                        <td>${escapeHtml(item.location)}</td>
                        <td class="col-time">${escapeHtml(item.time)}</td>
                        <td>${escapeHtml(item.food)}</td>
                        <td>${escapeHtml(item.price || '-')}</td>
                        <td class="col-story">${escapeHtml(item.story || '-')}</td>
                        <td class="col-time">${dateStr}</td>
                    </tr>
                `;
            }).join('');
        }

        function toggleRow(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateSelectUI();
            renderTable(allData);
        }

        function toggleSelectAll() {
            const checkAll = document.getElementById('check-all');
            if (checkAll.checked) {
                allData.forEach(item => selectedIds.add(item._id));
            } else {
                selectedIds.clear();
            }
            updateSelectUI();
            renderTable(allData);
        }

        function updateSelectUI() {
            const count = selectedIds.size;
            const btn = document.getElementById('btn-batch-delete');
            const countLabel = document.getElementById('select-count');
            const checkAll = document.getElementById('check-all');

            btn.disabled = count === 0;
            countLabel.textContent = count > 0 ? `已选 ${count} 条` : '';

            // 更新全选框状态
            if (allData.length > 0 && count === allData.length) {
                checkAll.checked = true;
                checkAll.indeterminate = false;
            } else if (count > 0) {
                checkAll.checked = false;
                checkAll.indeterminate = true;
            } else {
                checkAll.checked = false;
                checkAll.indeterminate = false;
            }
        }

        function showDeleteModal() {
            const count = selectedIds.size;
            if (count === 0) return;
            document.getElementById('delete-modal-text').textContent = `确定要删除选中的 ${count} 条记录吗？此操作不可恢复。`;
            document.getElementById('delete-modal').classList.add('active');
        }

        function hideDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
        }

        async function confirmDelete() {
            const ids = Array.from(selectedIds);
            hideDeleteModal();

            const btn = document.getElementById('btn-batch-delete');
            btn.disabled = true;
            btn.textContent = '删除中...';

            try {
                const res = await fetch(API_URL, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message);
                    selectedIds.clear();
                    loadData();
                } else {
                    alert(data.message || '删除失败');
                }
            } catch (e) {
                alert('网络错误，删除失败');
            } finally {
                btn.textContent = '🗑️ 批量删除';
                updateSelectUI();
            }
        }

        function updateStats(data) {
            document.getElementById('stat-total').textContent = data.length;

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            const todayCount = data.filter(d => new Date(d.createdAt) >= todayStart).length;
            const weekCount = data.filter(d => new Date(d.createdAt) >= weekStart).length;

            document.getElementById('stat-today').textContent = todayCount;
            document.getElementById('stat-week').textContent = weekCount;
        }

        function filterData() {
            const keyword = document.getElementById('search').value.toLowerCase();
            const filtered = allData.filter(item => {
                const text = `${item.name} ${item.location} ${item.food} ${item.story} ${item.contact}`.toLowerCase();
                return text.includes(keyword);
            });
            renderTable(filtered);
        }

        function exportCSV() {
            if (allData.length === 0) return alert('没有数据可导出');

            const headers = ['ID', '姓名', '联系方式', '事发地点', '被偷时间', '外卖内容', '金额', '详细描述', '提交时间', 'IP地址'];
            const rows = allData.map((item, index) => {
                const date = new Date(item.createdAt);
                const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                return [
                    allData.length - index,
                    item.name || '',
                    item.contact || '',
                    item.location || '',
                    item.time || '',
                    item.food || '',
                    item.price || '',
                    item.story || '',
                    dateStr,
                    item.ip || ''
                ];
            });

            const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `外卖哀悼馆数据_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
