<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖哀悼点 | 愿世间再无外卖贼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zcool+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
        }

        /* Skip Link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #667eea;
            color: #fff;
            padding: 8px 16px;
            z-index: 100;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            transition: top 0.2s;
        }

        .skip-link:focus {
            top: 0;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            #canvas-container {
                display: none;
            }
        }

        /* 飘落的哀悼纸片 Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1.5s ease;
        }

        .header h1 {
            font-family: 'Zcool QingKe HuangYou', cursive;
            font-size: 3.5rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            position: relative;
            display: inline-block;
            text-wrap: balance;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: shimmer 2s infinite;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-top: 20px;
            letter-spacing: 2px;
            text-wrap: pretty;
        }

        .subtitle small {
            color: #999;
        }

        .subtitle .counter {
            color: #667eea;
            font-weight: bold;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
        }

        /* 外卖盒动画 */
        .takeaway-box {
            width: 120px;
            height: 120px;
            margin: 30px auto;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        .takeaway-box svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4));
        }

        /* 哀悼蜡烛 */
        .candle-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            animation: fadeIn 2s ease;
        }

        .candle {
            width: 30px;
            height: 80px;
            position: relative;
        }

        .candle-body {
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 3px;
            position: absolute;
            bottom: 0;
        }

        .candle-flame {
            width: 16px;
            height: 24px;
            background: radial-gradient(ellipse at center bottom, #fff 0%, #ffeb3b 30%, #ff9800 60%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 20px #ff9800, 0 0 40px #ff5722;
        }

        /* 表单区域 */
        .form-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            animation: fadeInUp 1s ease 0.5s both;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #b0b0b0;
            text-wrap: balance;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            transition-property: border-color, background, box-shadow;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .input-with-btn {
            display: flex;
            gap: 8px;
        }

        .input-with-btn input {
            flex: 1;
        }

        .random-name-btn {
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            color: #a5b4fc;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition-property: background, color;
            transition-duration: 0.2s;
            white-space: nowrap;
        }

        .random-name-btn:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #c7d2fe;
        }

        .random-name-btn:focus-visible {
            outline: 2px solid #a5b4fc;
            outline-offset: 2px;
        }

        .error-text {
            display: block;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 6px;
            min-height: 1.2em;
        }

        /* Screen reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus visible */
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus,
        .submit-btn:focus-visible,
        .recent-item:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .submit-btn:focus-visible {
            box-shadow: 0 0 0 4px rgba(165, 180, 252, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.5rem;
            }
        }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition-property: transform, box-shadow;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 消息提示 */
        .message {
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.3);
            color: #2ecc71;
            display: block;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            display: block;
        }

        /* 安慰区域 */
        .comfort-section {
            text-align: center;
            animation: fadeInUp 0.8s ease both;
            padding: 20px 0;
        }

        .comfort-emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 16px;
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
        }

        .comfort-text {
            font-size: 1.3rem;
            color: #d0d0d0;
            margin-bottom: 8px;
            text-wrap: balance;
        }

        .comfort-sub {
            font-size: 0.95rem;
            color: #a0a0a0;
            text-wrap: pretty;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* 最近提交 */
        .recent-section {
            margin-top: 50px;
            animation: fadeInUp 1s ease 0.8s both;
        }

        .recent-title {
            text-align: center;
            font-size: 1.3rem;
            color: #b0b0b0;
            margin-bottom: 25px;
            text-wrap: balance;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recent-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition-property: background, border-color, transform;
            transition-duration: 0.3s;
            animation: slideIn 0.5s ease;
            cursor: pointer;
        }

        .recent-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        .recent-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .recent-item-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .recent-item-meta .name {
            color: #d0d0d0;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .recent-item-meta .dot {
            color: #666;
            font-size: 0.75rem;
        }

        .recent-item-meta .loc {
            color: #a0a0a0;
            font-size: 0.8rem;
        }

        .recent-item-meta .time {
            color: #888;
            font-size: 0.75rem;
        }

        .recent-item-food {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .recent-item-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .hug-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 20px;
            padding: 4px 12px;
            color: #a5b4fc;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition-property: background, border-color, color;
            transition-duration: 0.2s;
        }

        .hug-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.4);
            color: #c7d2fe;
        }

        .hug-btn.liked {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
            cursor: default;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #888;
            font-size: 0.9rem;
            animation: fadeIn 2s ease 1.5s both;
        }

        /* ===== 第二轮视觉升级：纪念空间主题 ===== */
        :root {
            --ink: #f7f3ff;
            --muted: #a6a6c0;
            --violet: #8b7cff;
            --violet-soft: rgba(139, 124, 255, 0.16);
            --panel: rgba(25, 24, 48, 0.72);
            --line: rgba(255, 255, 255, 0.11);
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, rgba(106, 77, 190, 0.34), transparent 42%),
                radial-gradient(circle at 8% 35%, rgba(52, 122, 157, 0.12), transparent 30%),
                linear-gradient(135deg, #0b0c12 0%, #15162a 48%, #101a31 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0.18;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
            mix-blend-mode: soft-light;
        }

        .container {
            max-width: 960px;
            padding-top: 22px;
        }

        .header {
            margin-bottom: 24px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid rgba(165, 180, 252, 0.2);
            border-radius: 999px;
            background: rgba(126, 113, 220, 0.1);
            color: #b9b6e9;
            font: 700 0.68rem/1.2 system-ui, sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #74e0bd;
            box-shadow: 0 0 12px #74e0bd;
        }

        .header h1 {
            margin-top: 12px;
            font-size: clamp(2.45rem, 6vw, 3.8rem);
            letter-spacing: 0.12em;
            filter: drop-shadow(0 10px 28px rgba(112, 93, 255, 0.22));
        }

        .subtitle {
            color: #cbc9dc;
        }

        .live-status {
            display: inline-flex;
            margin-top: 14px;
            padding: 8px 13px;
            border-radius: 10px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07);
            font: 500 0.78rem/1.2 system-ui, sans-serif;
            letter-spacing: 0.04em;
        }

        .live-status strong { color: #e9e6ff; }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px 16px;
            border: 1px solid rgba(165, 180, 252, 0.28);
            border-radius: 999px;
            color: #eeeaff;
            background: rgba(139, 124, 255, 0.14);
            font: 700 0.82rem/1.2 system-ui, sans-serif;
            text-decoration: none;
            transition: transform .2s ease, background .2s ease, border-color .2s ease;
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            background: rgba(139, 124, 255, 0.24);
            border-color: rgba(196, 188, 255, 0.6);
        }

        .hero-cta:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 3px;
        }

        .takeaway-box {
            width: 98px;
            height: 98px;
            margin: 20px auto 15px;
        }

        .candle-container {
            gap: 16px;
            margin: 20px 0 18px;
        }

        .candle {
            width: 27px;
            height: 66px;
        }

        .candle-body {
            height: 50px;
            border-radius: 4px 4px 6px 6px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 5px 16px rgba(255, 196, 92, .08);
        }

        .candle-body::after {
            content: '';
            position: absolute;
            left: 5px;
            right: 5px;
            top: 7px;
            height: 2px;
            border-radius: 50%;
            background: rgba(175, 160, 160, .26);
        }

        .candle-flame {
            width: 14px;
            height: 22px;
            top: -16px;
        }

        .form-container {
            scroll-margin-top: 20px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            color: #f2efff;
            background: rgba(7, 8, 18, 0.42);
            border-color: rgba(194, 188, 255, 0.2);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #85859d; }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #a99cff;
            background: rgba(12, 12, 27, 0.62);
            box-shadow: 0 0 0 4px rgba(139, 124, 255, 0.1), 0 0 24px rgba(139, 124, 255, 0.16);
        }

        .form-title { margin-bottom: 22px; }

        .submit-btn {
            min-height: 54px;
            font-weight: 700;
        }

        /* 内嵌时间选择器 */
        .time-picker { position: relative; }

        .time-display {
            padding-right: 52px !important;
            cursor: pointer;
        }

        .time-display[aria-expanded="true"] {
            border-color: #a99cff;
            box-shadow: 0 0 0 4px rgba(139, 124, 255, 0.1);
        }

        .time-picker-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 38px;
            height: 38px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 10px;
            color: #cfc9ff;
            background: rgba(139, 124, 255, 0.14);
            font-size: 1.35rem;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease;
        }

        .time-picker-toggle:hover { background: rgba(139, 124, 255, 0.28); }
        .time-picker-toggle[aria-expanded="true"] { transform: translateY(-50%) rotate(180deg); }

        .time-panel {
            position: absolute;
            z-index: 30;
            top: calc(100% + 10px);
            left: 0;
            width: min(100%, 480px);
            padding: 18px;
            border: 1px solid rgba(196, 188, 255, .2);
            border-radius: 18px;
            background: rgba(26, 25, 52, .98);
            box-shadow: 0 22px 60px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter: blur(18px);
            max-height: min(640px, calc(100vh - 28px));
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(165, 156, 255, .55) transparent;
        }

        .time-panel[hidden] { display: none; }
        .quick-time-title { margin-bottom: 10px; color: #aaa8c8; font: 700 .76rem/1.2 system-ui, sans-serif; letter-spacing: .08em; }
        .quick-time-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .quick-time-list button, .time-done {
            padding: 8px 11px;
            border: 1px solid rgba(165, 180, 252, .2);
            border-radius: 9px;
            color: #dcd8ff;
            background: rgba(139, 124, 255, .11);
            font: 500 .8rem/1.2 system-ui, sans-serif;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }
        .quick-time-list button:hover, .quick-time-list button:focus-visible { background: rgba(139,124,255,.25); border-color: #a99cff; transform: translateY(-1px); }
        .time-panel-divider { height: 1px; margin: 16px 0; background: rgba(255,255,255,.08); }
        .calendar-head { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; text-align: center; color: #f5f2ff; }
        .calendar-nav { width: 30px; height: 30px; border: 0; border-radius: 8px; color: #cfc9ff; background: rgba(255,255,255,.06); font-size: 1.5rem; line-height: 1; cursor: pointer; }
        .calendar-nav:hover { background: rgba(139,124,255,.25); }
        .calendar-week, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .calendar-week { margin: 16px 0 6px; color: #777792; font: 600 .72rem/1.2 system-ui, sans-serif; }
        .calendar-grid button { aspect-ratio: 1; border: 1px solid transparent; border-radius: 9px; color: #e3e1f1; background: transparent; font: 500 .82rem/1 system-ui, sans-serif; cursor: pointer; }
        .calendar-grid button:hover { background: rgba(139,124,255,.2); }
        .calendar-grid button.muted { color: #66677d; }
        .calendar-grid button.today { border-color: rgba(116,224,189,.7); color: #8ce8ca; }
        .calendar-grid button.selected { color: white; background: linear-gradient(135deg,#7668e9,#a65fbe); box-shadow: 0 5px 14px rgba(123,101,229,.3); }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

        @keyframes flicker {

        @keyframes shimmer {
            0% { opacity: 0.5; width: 60px; }
            50% { opacity: 1; width: 100px; }
            100% { opacity: 0.5; width: 60px; }

        @keyframes slideIn {
            from {

                transform: translateX(-20px);

            to {

                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <!-- 外卖盒 -->

                    <rect x="10" y="33" width="80" height="5" rx="2" fill="#c0c0c0"/>
                    <!-- 筷子 -->
                    <line x1="75" y1="10" x2="70" y2="50" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>

    <script>
        // ===== 飘落的哀悼纸片效果 =====
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = ['#667eea', '#764ba2', '#f093fb', '#a0a0a0', '#888'][Math.floor(Math.random() * 5)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 100) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + 10) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
            // 随机初始化位置
            particles[i].y = Math.random() * canvas.height;
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ===== 表单提交 =====
        const form = document.getElementById('report-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const comfortSection = document.getElementById('comfort-section');
        const btnAnother = document.getElementById('btn-another');
        const API_URL = '/api/submit'; // 部署后使用相对路径
        const DRAFT_KEY = 'takeaway-memorial-draft';
        let toastTimer;

        function showToast(text) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                toast.setAttribute('role', 'status');
                document.body.appendChild(toast);
            }
            toast.textContent = text;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
        }

        const draftFields = ['name', 'contact', 'location', 'time', 'food', 'price', 'story'];
        function saveDraft() {
            const draft = Object.fromEntries(draftFields.map(name => [name, name === 'time' ? (timeInput?.dataset.value || '') : form.elements[name].value]));
            sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        }

        function restoreDraft() {
            try {
                const draft = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || '{}');
                draftFields.forEach(name => {
                    if (draft[name]) form.elements[name].value = draft[name];
                });
            } catch (_) { /* ignore invalid local draft */ }
        }

        function clearDraft() {
            sessionStorage.removeItem(DRAFT_KEY);
        }

        restoreDraft();
        const timeInput = document.getElementById('input-time');
        const timeDisplay = timeInput;
        const timePicker = document.getElementById('time-picker');
        const timePanel = document.getElementById('time-panel');
        const timeToggle = document.getElementById('time-picker-toggle');
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarLabel = document.getElementById('calendar-label');
        const calendarPrev = document.getElementById('calendar-prev');
        const calendarNext = document.getElementById('calendar-next');
        const hourSelect = document.getElementById('time-hour');
        const minuteSelect = document.getElementById('time-minute');
        let selectedTime = timeInput.value ? new Date(timeInput.value) : null;
        let calendarCursor = selectedTime ? new Date(selectedTime.getFullYear(), selectedTime.getMonth(), 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);

        function pad(value) { return String(value).padStart(2, '0'); }
        function localDateValue(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`; }
        function displayDateValue(date) { return `${date.getFullYear()}年${pad(date.getMonth() + 1)}月${pad(date.getDate())}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`; }
        function startOfDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
        function isSameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
        function currentMinute() { return new Date(Math.floor(Date.now() / 60000) * 60000); }

        for (let hour = 0; hour < 24; hour++) hourSelect.add(new Option(pad(hour), pad(hour)));
        for (let minute = 0; minute < 60; minute++) minuteSelect.add(new Option(pad(minute), pad(minute)));

        function renderCalendar() {
            const year = calendarCursor.getFullYear();
            const month = calendarCursor.getMonth();
            const today = new Date();
            calendarLabel.textContent = `${year}年${pad(month + 1)}月`;
            calendarGrid.innerHTML = '';
            const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const previousDays = new Date(year, month, 0).getDate();

            for (let index = 0; index < 42; index++) {
                const dayNumber = index - firstDay + 1;
                const date = new Date(year, month, dayNumber);
                const button = document.createElement('button');
                button.type = 'button';
                button.setAttribute('role', 'gridcell');
                button.textContent = dayNumber < 1 ? previousDays + dayNumber : dayNumber > daysInMonth ? dayNumber - daysInMonth : dayNumber;
                if (date.getMonth() !== month) button.classList.add('muted');
                if (isSameDay(date, today)) button.classList.add('today');
                if (isSameDay(date, selectedTime)) button.classList.add('selected');
                button.addEventListener('click', () => {
                    const next = new Date(date);
                    next.setHours(selectedTime ? selectedTime.getHours() : new Date().getHours(), selectedTime ? selectedTime.getMinutes() : new Date().getMinutes(), 0, 0);
                    setSelectedTime(next);
                });
                calendarGrid.appendChild(button);
            }
            calendarPrev.disabled = year === 1970 && month === 0;
            calendarNext.disabled = year >= 2099 && month >= 11;
        }

        function setSelectedTime(value) {
            selectedTime = value;
            const serialized = localDateValue(value);
            timeInput.dataset.value = serialized;
            timeDisplay.value = displayDateValue(value);
            calendarCursor = new Date(value.getFullYear(), value.getMonth(), 1);
            hourSelect.value = pad(value.getHours());
            minuteSelect.value = pad(value.getMinutes());
            renderCalendar();
            saveDraft();
        }

        function setPanelOpen(open) {
            timePanel.hidden = !open;
            timeDisplay.setAttribute('aria-expanded', String(open));
            timeToggle.setAttribute('aria-expanded', String(open));
            if (open) {
                if (!selectedTime) setSelectedTime(currentMinute());
                renderCalendar();
                hourSelect.value = pad(selectedTime.getHours());
                minuteSelect.value = pad(selectedTime.getMinutes());
            }
        }

        if (selectedTime && !Number.isNaN(selectedTime.getTime())) setSelectedTime(selectedTime);
        else renderCalendar();
        timeDisplay.addEventListener('click', () => setPanelOpen(timePanel.hidden));
        timeToggle.addEventListener('click', () => setPanelOpen(timePanel.hidden));
        calendarPrev.addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() - 1); renderCalendar(); });
        calendarNext.addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() + 1); renderCalendar(); });
        hourSelect.addEventListener('change', () => { if (selectedTime) { selectedTime.setHours(Number(hourSelect.value)); setSelectedTime(selectedTime); } });
        minuteSelect.addEventListener('change', () => { if (selectedTime) { selectedTime.setMinutes(Number(minuteSelect.value)); setSelectedTime(selectedTime); } });
        document.getElementById('time-done').addEventListener('click', () => setPanelOpen(false));
        document.getElementById('quick-time-list').addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;
            const now = currentMinute();
            let value = button.dataset.offset ? new Date(now.getTime() - Number(button.dataset.offset) * 60000) : new Date(now);
            if (button.dataset.preset === 'noon') { value.setHours(12, 0, 0, 0); if (value > now) value = now; }
            setSelectedTime(value);
            setPanelOpen(false);
            showToast(`已选择 ${displayDateValue(value)}`);
        });
        document.addEventListener('click', event => { if (!timePicker.contains(event.target)) setPanelOpen(false); });

        const storyInput = document.getElementById('input-story');
        const storyCount = document.getElementById('story-count');
        function updateStoryCount() { storyCount.textContent = `${storyInput.value.length} / 2000`; }
        updateStoryCount();
        form.addEventListener('input', () => { updateStoryCount(); saveDraft(); });

        const FOOD_NAMES = [

            '炸鸡汉堡', '披萨', '寿司', '盖浇饭', '炒米粉',

            '烤冷面', '关东煮', '冒菜', '水煮鱼', '小龙虾',
            '煲仔饭', '肠粉', '云吞面', '热干面', '担担面',
            '铁板烧', '蛋炒饭', '炒河粉', '过桥米线', '土豆粉',
            '炸鸡排', '奶茶', '珍珠奶茶', '柠檬茶', '椰子鸡',
            '麻辣香锅', '烤鱼', '烤鸭饭', '叉烧饭', '烧鹅饭',
            '石锅拌饭', '炸酱面', '小笼包', '豆腐脑', '凉皮',

            '照烧鸡腿饭', '黑椒牛柳饭', '回锅肉饭', '鱼香肉丝饭', '宫保鸡丁饭',

        function getRandomFoodName() {
            return FOOD_NAMES[Math.floor(Math.random() * FOOD_NAMES.length)];
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function getAnonymousName(seed) {
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % FOOD_NAMES.length;
            return FOOD_NAMES[index];
        }

        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
        }

        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById('error-' + fieldId);
            if (errorEl) errorEl.textContent = message;
        }

        function validateForm() {
            clearErrors();
            let valid = true;
            const name = form.querySelector('#input-name');
            const location = form.querySelector('#input-location');
            const time = form.querySelector('#input-time');
            const food = form.querySelector('#input-food');

            if (!name.value.trim()) {
                showFieldError('name', '请输入你的名字');
                valid = false;
            }
            if (!location.value.trim()) {
                showFieldError('location', '请输入事发地点');
                valid = false;
            }
            if (!time.value || !timeInput.dataset.value) {
                showFieldError('time', '请选择被偷时间');
                valid = false;
            }
            if (!food.value.trim()) {
                showFieldError('food', '请输入外卖内容');
                valid = false;
            }
            return valid;
        }

        document.getElementById('btn-random-name').addEventListener('click', () => {
            document.getElementById('input-name').value = getRandomFoodName();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) {
                const firstError = form.querySelector('.error-text:not(:empty)');
                if (firstError) {
                    firstError.closest('.form-group').querySelector('input, textarea, select')?.focus();
                }
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>提交中...';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
            messageDiv.textContent = '';
            clearErrors();

            const formData = {
                name: form.querySelector('#input-name').value,
                contact: form.querySelector('#input-contact').value,
                location: form.querySelector('#input-location').value,
                time: timeInput.dataset.value,
                food: form.querySelector('#input-food').value,
                price: form.querySelector('#input-price').value,
                story: form.querySelector('#input-story').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    form.reset();
                    clearDraft();
                    updateStoryCount();
                    loadRecent();
                    form.style.display = 'none';
                    messageDiv.style.display = 'none';
                    comfortSection.style.display = 'block';
                    showToast('这份外卖已经被好好记住了');
                    btnAnother.focus();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message || '提交失败';
                    messageDiv.style.display = 'block';
                    messageDiv.focus();
                    showToast(data.message || '提交失败，请稍后再试');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '网络错误，请检查连接';
                messageDiv.style.display = 'block';
                messageDiv.focus();
                showToast('网络暂时走丢了，请稍后再试');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '提交哀悼';
            }
        });

        // ===== 加载统计数据 =====
        let allRecentItems = [];
        let expanded = false;
        const MAX_COLLAPSED = 3;
        const MAX_EXPANDED = 10;

        function renderRecentList() {
            const list = document.getElementById('recent-list');
            const section = document.getElementById('recent-section');
            const toggleBtn = document.getElementById('toggle-recent-btn');

            if (!allRecentItems.length) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';

            const maxCount = expanded ? MAX_EXPANDED : MAX_COLLAPSED;
            const displayItems = allRecentItems.slice(0, maxCount);

            list.innerHTML = displayItems.map((item) => {
                const date = new Date(item.createdAt);
                const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
                const itemId = item._id || item.id || item.createdAt;
                const liked = hasLikedReport(itemId);
                const likes = item.likes || 0;
                return `
                    <div class="recent-item" role="listitem" data-id="${escapeHtml(String(itemId))}" tabindex="0">
                        <div class="recent-item-header">
                            <div class="recent-item-meta">
                                <span class="name">${escapeHtml(item.name)}</span>
                                <span class="dot">·</span>
                                <span class="loc">${escapeHtml(item.location)}</span>
                                <span class="dot">·</span>
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                        <div class="recent-item-food">${escapeHtml(item.food)}</div>
                        <div class="recent-item-actions">
                            <button class="hug-btn ${liked ? 'liked' : ''}" data-id="${escapeHtml(String(itemId))}" ${liked ? 'disabled' : ''}>
                                <span>🫂</span>
                                <span>${likes > 0 ? likes + ' 人抱过' : '抱一抱'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (allRecentItems.length > MAX_COLLAPSED) {
                toggleBtn.textContent = expanded
                    ? '收起悼念'
                    : `展开更多 (${Math.min(allRecentItems.length, MAX_EXPANDED) - MAX_COLLAPSED})`;
                toggleBtn.style.display = 'block';
                toggleBtn.onclick = () => {
                    expanded = !expanded;
                    renderRecentList();
                };
            } else {
                toggleBtn.style.display = 'none';
            }

            list.querySelectorAll('.recent-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === id);
                    if (item) openDetail(item);
                });
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        el.click();
                    }
                });
            });

            list.querySelectorAll('.hug-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    likeReport(id);
                });
            });
        }

        async function loadStats() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                console.log('后端返回的完整数据：', data);
                if (data.success) {
                    document.getElementById('total-count').textContent = data.total;
                    allRecentItems = data.recent || [];
                    console.log('最近悼念列表数据：', allRecentItems);
                    if (allRecentItems.length > 0) {
                        console.log('第一条数据的所有字段名：', Object.keys(allRecentItems[0]));
                    }
                    renderRecentList();
                } else {
                    console.log('后端返回 success 为 false：', data);
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadRecent() {
            loadStats();
        }

        // ===== 详情弹窗 =====
        const detailOverlay = document.getElementById('detail-overlay');
        const detailContent = document.getElementById('detail-content');
        const detailClose = document.getElementById('detail-close');

        function openDetail(item) {
            const itemId = item._id || item.id || item.createdAt;
            const date = new Date(item.createdAt);
            const timeStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
            const storyText = item.story || item.description || item.detail || item.content || item.memo || item.desc || item.remark || item.notes || item.info || item.message || item.text || item.body || '';
            const liked = hasLikedReport(itemId);
            const likes = item.likes || 0;

            detailContent.innerHTML = `
                <div class="detail-title" id="detail-title">${escapeHtml(item.name)} 的哀悼</div>
                <div class="detail-hug">
                    <button class="detail-hug-btn ${liked ? 'liked' : ''}" data-id="${escapeHtml(String(itemId))}" ${liked ? 'disabled' : ''}>
                        <span>🫂</span>
                        <span>${likes > 0 ? likes + ' 人抱过' : '抱一抱'}</span>
                    </button>
                </div>
                <div class="detail-compact">
                    <div class="detail-compact-row">
                        <span class="detail-compact-item">📍 ${escapeHtml(item.location || '未填写')}</span>
                        <span class="detail-compact-item">🕐 ${escapeHtml(item.time ? item.time.replace('T', ' ') : timeStr)}</span>
                    </div>
                    <div class="detail-compact-row">
                        <span class="detail-compact-item">🍱 ${escapeHtml(item.food || '未填写')}</span>
                        ${item.price ? `<span class="detail-compact-item">💰 ${escapeHtml(item.price)}</span>` : ''}
                    </div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">详细描述</span>
                    <div class="detail-story">${escapeHtml(storyText || '暂无描述')}</div>
                </div>

                <div class="comment-section">
                    <div class="comment-title">💬 留言慰问</div>
                    <div class="comment-list" id="comment-list"></div>
                    <form class="comment-form" id="comment-form" data-item-id="${escapeHtml(String(itemId))}">
                        <textarea id="comment-text" placeholder="说点什么..." required></textarea>
                        <button type="submit" class="comment-submit">发送慰问</button>
                    </form>
                </div>
            `;

            detailOverlay.classList.add('active');
            detailOverlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            const detailHugBtn = detailContent.querySelector('.detail-hug-btn');
            if (detailHugBtn && !detailHugBtn.disabled) {
                detailHugBtn.addEventListener('click', () => {
                    likeReport(itemId);
                });
            }

            renderComments(itemId);

            const commentForm = document.getElementById('comment-form');
            commentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const textEl = document.getElementById('comment-text');
                const submitBtn = commentForm.querySelector('.comment-submit');
                const text = textEl.value.trim();
                if (!text || submitBtn.disabled) return;

                const anonName = getRandomFoodName();
                submitBtn.disabled = true;
                submitBtn.textContent = '发送中...';

                await addComment(itemId, anonName, text);

                commentForm.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = '发送慰问';
            });

            detailClose.focus();
        }

        function closeDetail() {
            detailOverlay.classList.remove('active');
            detailOverlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        detailClose.addEventListener('click', closeDetail);
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) closeDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && detailOverlay.classList.contains('active')) {
                closeDetail();
            }
        });

        // ===== 评论功能（后端持久化 + 点赞 + 回复） =====
        function hasLikedComment(itemId, commentId) {
            try {
                const key = 'memorial-liked-' + itemId;
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(commentId);
            } catch (e) {
                return false;
            }
        }

        function markLiked(itemId, commentId) {
            const key = 'memorial-liked-' + itemId;
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            if (!liked.includes(commentId)) {
                liked.push(commentId);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        function hasLikedReply(itemId, commentId, replyId) {
            try {
                const key = 'memorial-liked-reply-' + itemId + '-' + commentId;
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(replyId);
            } catch (e) {
                return false;
            }
        }

        function markLikedReply(itemId, commentId, replyId) {
            const key = 'memorial-liked-reply-' + itemId + '-' + commentId;
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            if (!liked.includes(replyId)) {
                liked.push(replyId);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        function renderComments(itemId) {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            if (!item) return;
            let comments = item.comments || [];

            // 兼容旧数据
            comments.forEach(c => {
                if (typeof c.likes === 'undefined') c.likes = 0;
                if (!c.id) c.id = generateId();
                if (!c.replies) c.replies = [];
                c.replies.forEach(r => {
                    if (typeof r.likes === 'undefined') r.likes = 0;
                    if (!r.id) r.id = generateId();
                });
            });

            // 按点赞数降序排列
            comments.sort((a, b) => b.likes - a.likes);

            if (!comments.length) {
                list.innerHTML = '<div class="comment-empty">暂无留言，来抢沙发吧~</div>';
                return;
            }

            list.innerHTML = comments.map(c => {
                const liked = hasLikedComment(itemId, c.id);
                const replyHtml = c.replies.map(r => {
                    const rLiked = hasLikedReply(itemId, c.id, r.id);
                    return `
                        <div class="comment-item reply-item">
                            <div class="comment-header">
                                <div class="comment-author">${escapeHtml(r.name)} <span class="reply-to">回复 @${escapeHtml(c.name)}</span></div>
                                <button class="comment-like ${rLiked ? 'liked' : ''}" data-parent-id="${escapeHtml(c.id)}" data-id="${escapeHtml(r.id)}" ${rLiked ? 'disabled' : ''}>
                                    <span class="like-icon">♥</span>
                                    <span class="like-count">${r.likes}</span>
                                </button>
                            </div>
                            <div class="comment-text">${escapeHtml(r.text)}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="comment-item" data-comment-id="${escapeHtml(c.id)}">
                        <div class="comment-header">
                            <div class="comment-author">${escapeHtml(c.name)}</div>
                            <button class="comment-like ${liked ? 'liked' : ''}" data-id="${escapeHtml(c.id)}" ${liked ? 'disabled' : ''}>
                                <span class="like-icon">♥</span>
                                <span class="like-count">${c.likes}</span>
                            </button>
                        </div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                        <div class="comment-actions">
                            <button class="comment-action-btn reply-btn" data-id="${escapeHtml(c.id)}">回复</button>
                        </div>
                        ${c.replies.length ? `<div class="comment-replies">${replyHtml}</div>` : ''}
                        <div class="reply-form" id="reply-form-${escapeHtml(c.id)}">
                            <div class="reply-to-label">回复 @${escapeHtml(c.name)}</div>
                            <textarea class="reply-textarea" placeholder="写点什么..." required></textarea>
                            <button class="reply-submit">发送回复</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定一级评论点赞
            list.querySelectorAll('.comment-like[data-id]:not([data-parent-id])').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.id;
                    await likeComment(itemId, commentId);
                });
            });

            // 绑定子评论点赞
            list.querySelectorAll('.comment-like[data-parent-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.parentId;
                    const replyId = btn.dataset.id;
                    await likeReply(itemId, commentId, replyId);
                });
            });

            // 绑定回复按钮
            list.querySelectorAll('.reply-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const commentId = btn.dataset.id;
                    const form = document.getElementById('reply-form-' + commentId);
                    // 关闭其他回复框
                    list.querySelectorAll('.reply-form.active').forEach(f => {
                        if (f !== form) f.classList.remove('active');
                    });
                    form.classList.toggle('active');
                    if (form.classList.contains('active')) {
                        form.querySelector('.reply-textarea').focus();
                    }
                });
            });

            // 绑定回复提交
            list.querySelectorAll('.reply-submit').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const form = btn.closest('.reply-form');
                    const commentId = form.id.replace('reply-form-', '');
                    const textarea = form.querySelector('.reply-textarea');
                    const text = textarea.value.trim();
                    if (!text) return;

                    const anonName = getRandomFoodName();
                    await addReply(itemId, commentId, anonName, text);
                    form.classList.remove('active');
                    textarea.value = '';
                });
            });
        }

        const pendingLikeIds = new Set();

        async function likeComment(itemId, commentId) {
            const pendingKey = `comment:${itemId}:${commentId}`;
            if (pendingLikeIds.has(pendingKey)) return;
            pendingLikeIds.add(pendingKey);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'like', id: itemId, commentId })
                });
                const data = await response.json();
                if (data.success) {
                    markLiked(itemId, commentId);
                    showToast('收到一份温柔的回应');
                    await loadStats();
                    renderComments(itemId);
                }
            } catch (error) {
                console.error('点赞失败:', error);
                showToast('回应没有送达，请稍后再试');
            } finally {
                pendingLikeIds.delete(pendingKey);
            }
        }

        async function likeReply(itemId, commentId, replyId) {
            const pendingKey = `reply:${itemId}:${commentId}:${replyId}`;
            if (pendingLikeIds.has(pendingKey)) return;
            pendingLikeIds.add(pendingKey);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'likeReply', id: itemId, commentId, replyId })
                });
                const data = await response.json();
                if (data.success) {
                    markLikedReply(itemId, commentId, replyId);
                    showToast('收到一份温柔的回应');
                    await loadStats();
                    renderComments(itemId);
                }
            } catch (error) {
                console.error('点赞失败:', error);
                showToast('回应没有送达，请稍后再试');
            } finally {
                pendingLikeIds.delete(pendingKey);
            }
        }

        function hasLikedReport(itemId) {
            try {
                const key = 'memorial-liked-report';
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(String(itemId));
            } catch (e) {
                return false;
            }
        }

        function markLikedReport(itemId) {
            const key = 'memorial-liked-report';
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            const id = String(itemId);
            if (!liked.includes(id)) {
                liked.push(id);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        async function likeReport(itemId) {
            const pendingKey = `report:${itemId}`;
            if (pendingLikeIds.has(pendingKey)) return;
            pendingLikeIds.add(pendingKey);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'likeReport', id: itemId })
                });
                const data = await response.json();
                if (data.success) {
                    markLikedReport(itemId);
                    showToast('抱抱已送达');
                    await loadStats();
                    // 如果在详情弹窗中，刷新详情
                    const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
                    if (item && detailOverlay.classList.contains('active')) {
                        openDetail(item);
                    }
                }
            } catch (error) {
                console.error('抱一抱失败:', error);
                showToast('抱抱没有送达，请稍后再试');
            } finally {
                pendingLikeIds.delete(pendingKey);
            }
        }

        let submittingComment = false;

        async function addComment(itemId, name, text) {
            if (submittingComment) return;
            submittingComment = true;

            const tempId = 'temp-' + generateId();
            const tempComment = { id: tempId, name, text, time: Date.now(), likes: 0, replies: [] };

            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            if (item) {
                if (!item.comments) item.comments = [];
                item.comments.push(tempComment);
                renderComments(itemId);
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'comment', id: itemId, name, text, commentId: generateId() })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('留言已送达');
                    await loadStats();
                    renderComments(itemId);
                } else {
                    // 后端失败，回滚乐观更新
                    if (item && item.comments) {
                        item.comments = item.comments.filter(c => c.id !== tempId);
                        renderComments(itemId);
                    }
                    console.error('评论失败:', data.message);
                    showToast(data.message || '留言没有送达');
                }
            } catch (error) {
                // 网络失败，回滚乐观更新
                if (item && item.comments) {
                    item.comments = item.comments.filter(c => c.id !== tempId);
                    renderComments(itemId);
                }
                console.error('评论失败:', error);
                showToast('网络暂时走丢了，请稍后再试');
            } finally {
                submittingComment = false;
            }
        }

        let submittingReply = false;

        async function addReply(itemId, commentId, name, text) {
            if (submittingReply) return;
            submittingReply = true;

            const tempId = 'temp-' + generateId();
            const tempReply = { id: tempId, name, text, time: Date.now(), likes: 0 };

            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            let comment = null;
            if (item) {
                comment = item.comments.find(c => c.id === commentId);
                if (comment) {
                    if (!comment.replies) comment.replies = [];
                    comment.replies.push(tempReply);
                    renderComments(itemId);
                }
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reply', id: itemId, commentId, name, text, replyId: generateId() })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('回复已送达');
                    await loadStats();
                    renderComments(itemId);
                } else {
                    // 后端失败，回滚乐观更新
                    if (comment && comment.replies) {
                        comment.replies = comment.replies.filter(r => r.id !== tempId);
                        renderComments(itemId);
                    }
                    console.error('回复失败:', data.message);
                    showToast(data.message || '回复没有送达');
                }
            } catch (error) {
                // 网络失败，回滚乐观更新
                if (comment && comment.replies) {
                    comment.replies = comment.replies.filter(r => r.id !== tempId);
                    renderComments(itemId);
                }
                console.error('回复失败:', error);
                showToast('网络暂时走丢了，请稍后再试');
            } finally {
                submittingReply = false;
            }
        }

        btnAnother.addEventListener('click', () => {
            comfortSection.style.display = 'none';
            form.style.display = 'block';
            messageDiv.style.display = 'none';
            form.querySelector('input, textarea, select')?.focus();
            showToast('继续记录下一份纪念');
        });

        // 页面加载时获取数据
        loadStats();
    </script>
</body>
</html>
