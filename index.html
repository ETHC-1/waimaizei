<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖哀悼点 | 愿世间再无外卖贼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zcool+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
        }

        /* Skip Link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #667eea;
            color: #fff;
            padding: 8px 16px;
            z-index: 100;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            transition: top 0.2s;
        }

        .skip-link:focus {
            top: 0;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            #canvas-container {
                display: none;
            }
        }

        /* 飘落的哀悼纸片 Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1.5s ease;
        }

        .header h1 {
            font-family: 'Zcool QingKe HuangYou', cursive;
            font-size: 3.5rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
            position: relative;
            display: inline-block;
            text-wrap: balance;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: shimmer 2s infinite;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-top: 20px;
            letter-spacing: 2px;
            text-wrap: pretty;
        }

        .subtitle small {
            color: #999;
        }

        .subtitle .counter {
            color: #667eea;
            font-weight: bold;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
        }

        /* 外卖盒动画 */
        .takeaway-box {
            width: 120px;
            height: 120px;
            margin: 30px auto;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        .takeaway-box svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4));
        }

        /* 哀悼蜡烛 */
        .candle-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            animation: fadeIn 2s ease;
        }

        .candle {
            width: 30px;
            height: 80px;
            position: relative;
        }

        .candle-body {
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 3px;
            position: absolute;
            bottom: 0;
        }

        .candle-flame {
            width: 16px;
            height: 24px;
            background: radial-gradient(ellipse at center bottom, #fff 0%, #ffeb3b 30%, #ff9800 60%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 20px #ff9800, 0 0 40px #ff5722;
        }

        /* 表单区域 */
        .form-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            animation: fadeInUp 1s ease 0.5s both;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #b0b0b0;
            text-wrap: balance;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            transition-property: border-color, background, box-shadow;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .input-with-btn {
            display: flex;
            gap: 8px;
        }

        .input-with-btn input {
            flex: 1;
        }

        .random-name-btn {
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            color: #a5b4fc;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition-property: background, color;
            transition-duration: 0.2s;
            white-space: nowrap;
        }

        .random-name-btn:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #c7d2fe;
        }

        .random-name-btn:focus-visible {
            outline: 2px solid #a5b4fc;
            outline-offset: 2px;
        }

        .error-text {
            display: block;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 6px;
            min-height: 1.2em;
        }

        /* Screen reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus visible */
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus,
        .submit-btn:focus-visible,
        .recent-item:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .submit-btn:focus-visible {
            box-shadow: 0 0 0 4px rgba(165, 180, 252, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.5rem;
            }
        }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition-property: transform, box-shadow;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 消息提示 */
        .message {
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.3);
            color: #2ecc71;
            display: block;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            display: block;
        }

        /* 安慰区域 */
        .comfort-section {
            text-align: center;
            animation: fadeInUp 0.8s ease both;
            padding: 20px 0;
        }

        .comfort-emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 16px;
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
        }

        .comfort-text {
            font-size: 1.3rem;
            color: #d0d0d0;
            margin-bottom: 8px;
            text-wrap: balance;
        }

        .comfort-sub {
            font-size: 0.95rem;
            color: #a0a0a0;
            text-wrap: pretty;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* 最近提交 */
        .recent-section {
            margin-top: 50px;
            animation: fadeInUp 1s ease 0.8s both;
        }

        .recent-title {
            text-align: center;
            font-size: 1.3rem;
            color: #b0b0b0;
            margin-bottom: 25px;
            text-wrap: balance;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recent-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition-property: background, border-color, transform;
            transition-duration: 0.3s;
            animation: slideIn 0.5s ease;
            cursor: pointer;
        }

        .recent-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        .recent-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .recent-item-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .recent-item-meta .name {
            color: #d0d0d0;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .recent-item-meta .dot {
            color: #666;
            font-size: 0.75rem;
        }

        .recent-item-meta .loc {
            color: #a0a0a0;
            font-size: 0.8rem;
        }

        .recent-item-meta .time {
            color: #888;
            font-size: 0.75rem;
        }

        .recent-item-food {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .recent-item-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .hug-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 20px;
            padding: 4px 12px;
            color: #a5b4fc;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition-property: background, border-color, color;
            transition-duration: 0.2s;
        }

        .hug-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.4);
            color: #c7d2fe;
        }

        .hug-btn.liked {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
            cursor: default;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #888;
            font-size: 0.9rem;
            animation: fadeIn 2s ease 1.5s both;
        }

        .footer .quote {
            font-style: italic;
            margin-bottom: 10px;
            color: #999;
            text-wrap: pretty;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes flicker {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateX(-50%) scale(1.1) skewX(2deg);
                opacity: 0.9;
            }
        }

        @keyframes shimmer {
            0% { opacity: 0.5; width: 60px; }
            50% { opacity: 1; width: 100px; }
            100% { opacity: 0.5; width: 60px; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 折叠展开 */
        .recent-item-hidden {
            display: none;
        }

        .toggle-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #a0a0a0;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition-property: background, color;
            transition-duration: 0.3s;
            text-align: center;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
        }

        .toggle-btn:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        /* 详情弹窗 */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .detail-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .detail-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            transform: translateY(20px) scale(0.98);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .detail-overlay.active .detail-modal {
            transform: translateY(0) scale(1);
        }

        .detail-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition-property: background, color;
            transition-duration: 0.2s;
        }

        .detail-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #e0e0e0;
        }

        .detail-close:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .detail-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #d0d0d0;
            text-wrap: balance;
            padding-right: 40px;
        }

        .detail-row {
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .detail-label {
            color: #888;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 2px;
        }

        .detail-value {
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .detail-story {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 8px;
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.7;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-compact {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-compact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }

        .detail-compact-row:last-child {
            margin-bottom: 0;
        }

        .detail-compact-item {
            color: #c0c0c0;
            font-size: 0.9rem;
        }

        .detail-hug {
            display: flex;
            justify-content: center;
            margin: 12px 0 4px;
        }

        .detail-hug-btn {
            padding: 10px 24px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 24px;
            color: #a5b4fc;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition-property: background, border-color, color, transform;
            transition-duration: 0.2s;
        }

        .detail-hug-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
            transform: scale(1.05);
        }

        .detail-hug-btn.liked {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.6);
            color: #c7d2fe;
            cursor: default;
            transform: scale(1);
        }

        /* 评论区 */
        .comment-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .comment-title {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 16px;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 240px;
            overflow-y: auto;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 14px;
        }

        .comment-author {
            color: #667eea;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .comment-text {
            color: #c0c0c0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .comment-like {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 4px 12px;
            color: #a0a0a0;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition-property: border-color, color, background;
            transition-duration: 0.2s;
            font-family: inherit;
        }

        .comment-like:hover {
            border-color: rgba(102, 126, 234, 0.5);
            color: #e0e0e0;
        }

        .comment-like.liked {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.4);
            color: #667eea;
            cursor: default;
        }

        .comment-like:focus-visible {
            outline: 2px solid #a5b4fc;
            outline-offset: 2px;
        }

        .comment-empty {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            padding: 12px 0;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-form textarea {
            width: 100%;
            padding: 12px 16px;

    <script>
        // ===== 飘落的哀悼纸片效果 =====
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = ['#667eea', '#764ba2', '#f093fb', '#a0a0a0', '#888'][Math.floor(Math.random() * 5)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 100) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + 10) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
            // 随机初始化位置
            particles[i].y = Math.random() * canvas.height;
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ===== 表单提交 =====
        const form = document.getElementById('report-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const comfortSection = document.getElementById('comfort-section');
        const btnAnother = document.getElementById('btn-another');
        const API_URL = '/api/submit'; // 部署后使用相对路径

        const FOOD_NAMES = [
            '黄焖鸡米饭', '兰州拉面', '麻辣烫', '螺蛳粉', '酸辣粉',
            '炸鸡汉堡', '披萨', '寿司', '盖浇饭', '炒米粉',
            '猪脚饭', '卤肉饭', '牛肉面', '煎饼果子', '肉夹馍',
            '烤冷面', '关东煮', '冒菜', '水煮鱼', '小龙虾',
            '煲仔饭', '肠粉', '云吞面', '热干面', '担担面',
            '铁板烧', '蛋炒饭', '炒河粉', '过桥米线', '土豆粉',
            '炸鸡排', '奶茶', '珍珠奶茶', '柠檬茶', '椰子鸡',
            '麻辣香锅', '烤鱼', '烤鸭饭', '叉烧饭', '烧鹅饭',
            '石锅拌饭', '炸酱面', '小笼包', '豆腐脑', '凉皮',
            '盖浇面', '叉烧包', '馄饨', '牛肉拉面', '三鲜米线',
            '重庆小面', '武汉热干面', '陕西油泼面', '刀削面', '烩面',
            '焖面', '打卤面', '阳春面', '葱油拌面', '蟹黄面',
            '鲍汁捞饭', '腊味煲仔饭', '扬州炒饭', '蛋包饭', '咖喱饭',
            '照烧鸡腿饭', '黑椒牛柳饭', '回锅肉饭', '鱼香肉丝饭', '宫保鸡丁饭',
            '糖醋里脊饭', '梅菜扣肉饭', '东坡肉饭', '麻婆豆腐饭', '干锅牛蛙',
            '酸菜鱼', '水煮肉片', '毛血旺', '夫妻肺片', '口水鸡',
            '盐水鸭', '酱板鸭', '叫花鸡', '白切鸡', '盐焗鸡',
            '手撕鸡', '大盘鸡', '辣子鸡', '可乐鸡翅', '奥尔良烤翅',
            '蜜汁烤翅', '香辣虾', '蒜蓉粉丝蒸扇贝', '烤生蚝', '烤串',
            '臭豆腐', '糖葫芦', '鸡蛋灌饼', '手抓饼', '韭菜盒子'
        ];

        function getRandomFoodName() {
            return FOOD_NAMES[Math.floor(Math.random() * FOOD_NAMES.length)];
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function getAnonymousName(seed) {
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % FOOD_NAMES.length;
            return FOOD_NAMES[index];
        }

        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
        }

        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById('error-' + fieldId);
            if (errorEl) errorEl.textContent = message;
        }

        function validateForm() {
            clearErrors();
            let valid = true;
            const name = form.querySelector('#input-name');
            const location = form.querySelector('#input-location');
            const time = form.querySelector('#input-time');
            const food = form.querySelector('#input-food');

            if (!name.value.trim()) {
                showFieldError('name', '请输入你的名字');
                valid = false;
            }
            if (!location.value.trim()) {
                showFieldError('location', '请输入事发地点');
                valid = false;
            }
            if (!time.value) {
                showFieldError('time', '请选择被偷时间');
                valid = false;
            }
            if (!food.value.trim()) {
                showFieldError('food', '请输入外卖内容');
                valid = false;
            }
            return valid;
        }

        document.getElementById('btn-random-name').addEventListener('click', () => {
            document.getElementById('input-name').value = getRandomFoodName();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) {
                const firstError = form.querySelector('.error-text:not(:empty)');
                if (firstError) {
                    firstError.closest('.form-group').querySelector('input, textarea, select')?.focus();
                }
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>提交中...';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
            messageDiv.textContent = '';
            clearErrors();

            const formData = {
                name: form.querySelector('#input-name').value,
                contact: form.querySelector('#input-contact').value,
                location: form.querySelector('#input-location').value,
                time: form.querySelector('#input-time').value,
                food: form.querySelector('#input-food').value,
                price: form.querySelector('#input-price').value,
                story: form.querySelector('#input-story').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    form.reset();
                    loadRecent();
                    form.style.display = 'none';
                    messageDiv.style.display = 'none';
                    comfortSection.style.display = 'block';
                    btnAnother.focus();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message || '提交失败';
                    messageDiv.style.display = 'block';
                    messageDiv.focus();
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '网络错误，请检查连接';
                messageDiv.style.display = 'block';
                messageDiv.focus();
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '提交哀悼';
            }
        });

        // ===== 加载统计数据 =====
        let allRecentItems = [];
        let expanded = false;
        const MAX_COLLAPSED = 3;
        const MAX_EXPANDED = 10;

        function renderRecentList() {
            const list = document.getElementById('recent-list');
            const section = document.getElementById('recent-section');
            const toggleBtn = document.getElementById('toggle-recent-btn');

            if (!allRecentItems.length) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';

            const maxCount = expanded ? MAX_EXPANDED : MAX_COLLAPSED;
            const displayItems = allRecentItems.slice(0, maxCount);

            list.innerHTML = displayItems.map((item) => {
                const date = new Date(item.createdAt);
                const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
                const itemId = item._id || item.id || item.createdAt;
                const liked = hasLikedReport(itemId);
                const likes = item.likes || 0;
                return `
                    <div class="recent-item" role="listitem" data-id="${escapeHtml(String(itemId))}" tabindex="0">
                        <div class="recent-item-header">
                            <div class="recent-item-meta">
                                <span class="name">${escapeHtml(item.name)}</span>
                                <span class="dot">·</span>
                                <span class="loc">${escapeHtml(item.location)}</span>
                                <span class="dot">·</span>
                                <span class="time">${timeStr}</span>
                            </div>
                        </div>
                        <div class="recent-item-food">${escapeHtml(item.food)}</div>
                        <div class="recent-item-actions">
                            <button class="hug-btn ${liked ? 'liked' : ''}" data-id="${escapeHtml(String(itemId))}" ${liked ? 'disabled' : ''}>
                                <span>🫂</span>
                                <span>${likes > 0 ? likes + ' 人抱过' : '抱一抱'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            if (allRecentItems.length > MAX_COLLAPSED) {
                toggleBtn.textContent = expanded
                    ? '收起悼念'
                    : `展开更多 (${Math.min(allRecentItems.length, MAX_EXPANDED) - MAX_COLLAPSED})`;
                toggleBtn.style.display = 'block';
                toggleBtn.onclick = () => {
                    expanded = !expanded;
                    renderRecentList();
                };
            } else {
                toggleBtn.style.display = 'none';
            }

            list.querySelectorAll('.recent-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === id);
                    if (item) openDetail(item);
                });
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        el.click();
                    }
                });
            });

            list.querySelectorAll('.hug-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    likeReport(id);
                });
            });
        }

        async function loadStats() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                console.log('后端返回的完整数据：', data);
                if (data.success) {
                    document.getElementById('total-count').textContent = data.total;
                    allRecentItems = data.recent || [];
                    console.log('最近悼念列表数据：', allRecentItems);
                    if (allRecentItems.length > 0) {
                        console.log('第一条数据的所有字段名：', Object.keys(allRecentItems[0]));
                    }
                    renderRecentList();
                } else {
                    console.log('后端返回 success 为 false：', data);
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadRecent() {
            loadStats();
        }

        // ===== 详情弹窗 =====
        const detailOverlay = document.getElementById('detail-overlay');
        const detailContent = document.getElementById('detail-content');
        const detailClose = document.getElementById('detail-close');

        function openDetail(item) {
            const itemId = item._id || item.id || item.createdAt;
            const date = new Date(item.createdAt);
            const timeStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
            const storyText = item.story || item.description || item.detail || item.content || item.memo || item.desc || item.remark || item.notes || item.info || item.message || item.text || item.body || '';
            const liked = hasLikedReport(itemId);
            const likes = item.likes || 0;

            detailContent.innerHTML = `
                <div class="detail-title" id="detail-title">${escapeHtml(item.name)} 的哀悼</div>
                <div class="detail-hug">
                    <button class="detail-hug-btn ${liked ? 'liked' : ''}" data-id="${escapeHtml(String(itemId))}" ${liked ? 'disabled' : ''}>
                        <span>🫂</span>
                        <span>${likes > 0 ? likes + ' 人抱过' : '抱一抱'}</span>
                    </button>
                </div>
                <div class="detail-compact">
                    <div class="detail-compact-row">
                        <span class="detail-compact-item">📍 ${escapeHtml(item.location || '未填写')}</span>
                        <span class="detail-compact-item">🕐 ${escapeHtml(item.time ? item.time.replace('T', ' ') : timeStr)}</span>
                    </div>
                    <div class="detail-compact-row">
                        <span class="detail-compact-item">🍱 ${escapeHtml(item.food || '未填写')}</span>
                        ${item.price ? `<span class="detail-compact-item">💰 ${escapeHtml(item.price)}</span>` : ''}
                    </div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">详细描述</span>
                    <div class="detail-story">${escapeHtml(storyText || '暂无描述')}</div>
                </div>

                <div class="comment-section">
                    <div class="comment-title">💬 留言慰问</div>
                    <div class="comment-list" id="comment-list"></div>
                    <form class="comment-form" id="comment-form" data-item-id="${escapeHtml(String(itemId))}">
                        <textarea id="comment-text" placeholder="说点什么..." required></textarea>
                        <button type="submit" class="comment-submit">发送慰问</button>
                    </form>
                </div>
            `;

            detailOverlay.classList.add('active');
            detailOverlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            const detailHugBtn = detailContent.querySelector('.detail-hug-btn');
            if (detailHugBtn && !detailHugBtn.disabled) {
                detailHugBtn.addEventListener('click', () => {
                    likeReport(itemId);
                });
            }

            renderComments(itemId);

            const commentForm = document.getElementById('comment-form');
            commentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const textEl = document.getElementById('comment-text');
                const submitBtn = commentForm.querySelector('.comment-submit');
                const text = textEl.value.trim();
                if (!text || submitBtn.disabled) return;

                const anonName = getRandomFoodName();
                submitBtn.disabled = true;
                submitBtn.textContent = '发送中...';

                await addComment(itemId, anonName, text);

                commentForm.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = '发送慰问';
            });

            detailClose.focus();
        }

        function closeDetail() {
            detailOverlay.classList.remove('active');
            detailOverlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        detailClose.addEventListener('click', closeDetail);
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) closeDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && detailOverlay.classList.contains('active')) {
                closeDetail();
            }
        });

        // ===== 评论功能（后端持久化 + 点赞 + 回复） =====
        function hasLikedComment(itemId, commentId) {
            try {
                const key = 'memorial-liked-' + itemId;
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(commentId);
            } catch (e) {
                return false;
            }
        }

        function markLiked(itemId, commentId) {
            const key = 'memorial-liked-' + itemId;
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            if (!liked.includes(commentId)) {
                liked.push(commentId);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        function hasLikedReply(itemId, commentId, replyId) {
            try {
                const key = 'memorial-liked-reply-' + itemId + '-' + commentId;
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(replyId);
            } catch (e) {
                return false;
            }
        }

        function markLikedReply(itemId, commentId, replyId) {
            const key = 'memorial-liked-reply-' + itemId + '-' + commentId;
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            if (!liked.includes(replyId)) {
                liked.push(replyId);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        function renderComments(itemId) {
            const list = document.getElementById('comment-list');
            if (!list) return;
            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            if (!item) return;
            let comments = item.comments || [];

            // 兼容旧数据
            comments.forEach(c => {
                if (typeof c.likes === 'undefined') c.likes = 0;
                if (!c.id) c.id = generateId();
                if (!c.replies) c.replies = [];
                c.replies.forEach(r => {
                    if (typeof r.likes === 'undefined') r.likes = 0;
                    if (!r.id) r.id = generateId();
                });
            });

            // 按点赞数降序排列
            comments.sort((a, b) => b.likes - a.likes);

            if (!comments.length) {
                list.innerHTML = '<div class="comment-empty">暂无留言，来抢沙发吧~</div>';
                return;
            }

            list.innerHTML = comments.map(c => {
                const liked = hasLikedComment(itemId, c.id);
                const replyHtml = c.replies.map(r => {
                    const rLiked = hasLikedReply(itemId, c.id, r.id);
                    return `
                        <div class="comment-item reply-item">
                            <div class="comment-header">
                                <div class="comment-author">${escapeHtml(r.name)} <span class="reply-to">回复 @${escapeHtml(c.name)}</span></div>
                                <button class="comment-like ${rLiked ? 'liked' : ''}" data-parent-id="${escapeHtml(c.id)}" data-id="${escapeHtml(r.id)}" ${rLiked ? 'disabled' : ''}>
                                    <span class="like-icon">♥</span>
                                    <span class="like-count">${r.likes}</span>
                                </button>
                            </div>
                            <div class="comment-text">${escapeHtml(r.text)}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="comment-item" data-comment-id="${escapeHtml(c.id)}">
                        <div class="comment-header">
                            <div class="comment-author">${escapeHtml(c.name)}</div>
                            <button class="comment-like ${liked ? 'liked' : ''}" data-id="${escapeHtml(c.id)}" ${liked ? 'disabled' : ''}>
                                <span class="like-icon">♥</span>
                                <span class="like-count">${c.likes}</span>
                            </button>
                        </div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                        <div class="comment-actions">
                            <button class="comment-action-btn reply-btn" data-id="${escapeHtml(c.id)}">回复</button>
                        </div>
                        ${c.replies.length ? `<div class="comment-replies">${replyHtml}</div>` : ''}
                        <div class="reply-form" id="reply-form-${escapeHtml(c.id)}">
                            <div class="reply-to-label">回复 @${escapeHtml(c.name)}</div>
                            <textarea class="reply-textarea" placeholder="写点什么..." required></textarea>
                            <button class="reply-submit">发送回复</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 绑定一级评论点赞
            list.querySelectorAll('.comment-like[data-id]:not([data-parent-id])').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.id;
                    await likeComment(itemId, commentId);
                });
            });

            // 绑定子评论点赞
            list.querySelectorAll('.comment-like[data-parent-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.parentId;
                    const replyId = btn.dataset.id;
                    await likeReply(itemId, commentId, replyId);
                });
            });

            // 绑定回复按钮
            list.querySelectorAll('.reply-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const commentId = btn.dataset.id;
                    const form = document.getElementById('reply-form-' + commentId);
                    // 关闭其他回复框
                    list.querySelectorAll('.reply-form.active').forEach(f => {
                        if (f !== form) f.classList.remove('active');
                    });
                    form.classList.toggle('active');
                    if (form.classList.contains('active')) {
                        form.querySelector('.reply-textarea').focus();
                    }
                });
            });

            // 绑定回复提交
            list.querySelectorAll('.reply-submit').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const form = btn.closest('.reply-form');
                    const commentId = form.id.replace('reply-form-', '');
                    const textarea = form.querySelector('.reply-textarea');
                    const text = textarea.value.trim();
                    if (!text) return;

                    const anonName = getRandomFoodName();
                    await addReply(itemId, commentId, anonName, text);
                    form.classList.remove('active');
                    textarea.value = '';
                });
            });
        }

        async function likeComment(itemId, commentId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'like', id: itemId, commentId })
                });
                const data = await response.json();
                if (data.success) {
                    markLiked(itemId, commentId);
                    await loadStats();
                    renderComments(itemId);
                }
            } catch (error) {
                console.error('点赞失败:', error);
            }
        }

        async function likeReply(itemId, commentId, replyId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'likeReply', id: itemId, commentId, replyId })
                });
                const data = await response.json();
                if (data.success) {
                    markLikedReply(itemId, commentId, replyId);
                    await loadStats();
                    renderComments(itemId);
                }
            } catch (error) {
                console.error('点赞失败:', error);
            }
        }

        function hasLikedReport(itemId) {
            try {
                const key = 'memorial-liked-report';
                const liked = JSON.parse(localStorage.getItem(key) || '[]');
                return liked.includes(String(itemId));
            } catch (e) {
                return false;
            }
        }

        function markLikedReport(itemId) {
            const key = 'memorial-liked-report';
            const liked = JSON.parse(localStorage.getItem(key) || '[]');
            const id = String(itemId);
            if (!liked.includes(id)) {
                liked.push(id);
                localStorage.setItem(key, JSON.stringify(liked));
            }
        }

        async function likeReport(itemId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'likeReport', id: itemId })
                });
                const data = await response.json();
                if (data.success) {
                    markLikedReport(itemId);
                    await loadStats();
                    // 如果在详情弹窗中，刷新详情
                    const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
                    if (item && detailOverlay.classList.contains('active')) {
                        openDetail(item);
                    }
                }
            } catch (error) {
                console.error('抱一抱失败:', error);
            }
        }

        let submittingComment = false;

        async function addComment(itemId, name, text) {
            if (submittingComment) return;
            submittingComment = true;

            const tempId = 'temp-' + generateId();
            const tempComment = { id: tempId, name, text, time: Date.now(), likes: 0, replies: [] };

            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            if (item) {
                if (!item.comments) item.comments = [];
                item.comments.push(tempComment);
                renderComments(itemId);
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'comment', id: itemId, name, text, commentId: generateId() })
                });
                const data = await response.json();
                if (data.success) {
                    await loadStats();
                    renderComments(itemId);
                } else {
                    // 后端失败，回滚乐观更新
                    if (item && item.comments) {
                        item.comments = item.comments.filter(c => c.id !== tempId);
                        renderComments(itemId);
                    }
                    console.error('评论失败:', data.message);
                }
            } catch (error) {
                // 网络失败，回滚乐观更新
                if (item && item.comments) {
                    item.comments = item.comments.filter(c => c.id !== tempId);
                    renderComments(itemId);
                }
                console.error('评论失败:', error);
            } finally {
                submittingComment = false;
            }
        }

        let submittingReply = false;

        async function addReply(itemId, commentId, name, text) {
            if (submittingReply) return;
            submittingReply = true;

            const tempId = 'temp-' + generateId();
            const tempReply = { id: tempId, name, text, time: Date.now(), likes: 0 };

            const item = allRecentItems.find(i => String(i._id || i.id || i.createdAt) === String(itemId));
            let comment = null;
            if (item) {
                comment = item.comments.find(c => c.id === commentId);
                if (comment) {
                    if (!comment.replies) comment.replies = [];
                    comment.replies.push(tempReply);
                    renderComments(itemId);
                }
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reply', id: itemId, commentId, name, text, replyId: generateId() })
                });
                const data = await response.json();
                if (data.success) {
                    await loadStats();
                    renderComments(itemId);
                } else {
                    // 后端失败，回滚乐观更新
                    if (comment && comment.replies) {
                        comment.replies = comment.replies.filter(r => r.id !== tempId);
                        renderComments(itemId);
                    }
                    console.error('回复失败:', data.message);
                }
            } catch (error) {
                // 网络失败，回滚乐观更新
                if (comment && comment.replies) {
                    comment.replies = comment.replies.filter(r => r.id !== tempId);
                    renderComments(itemId);
                }
                console.error('回复失败:', error);
            } finally {
                submittingReply = false;
            }
        }

        btnAnother.addEventListener('click', () => {
            comfortSection.style.display = 'none';
            form.style.display = 'block';
            messageDiv.style.display = 'none';
            form.querySelector('input, textarea, select')?.focus();
        });

        // 页面加载时获取数据
        loadStats();
    </script>
</body>
</html>
